[package]
name = "gemini-chat-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Command-line chat with the official Gemini Enterprise assistant"
keywords = ["gemini", "gemini-enterprise", "cli", "google-cloud"]
categories = ["command-line-utilities"]

[[bin]]
name = "gemini-chat"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5.49", features = ["derive", "env"] }
gemini-chat = { version = "0.1.0", path = "../gemini-chat" }
humantime = "2.3.0"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
