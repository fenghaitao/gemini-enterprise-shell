[project]
name = "gesh"
version = "0.1.0"
description = "Line-based shell for Gemini Enterprise: assistant chat and NotebookLM Enterprise notebooks"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "nblm",
    "gemini-chat",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.scripts]
gesh = "gesh.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.uv.sources]
# Both SDKs (Rust/PyO3) are built from this repository.
nblm = { path = "../python", editable = true }
gemini-chat = { path = "../python/gemini-chat", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesh"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["prompt_toolkit.*"]
ignore_missing_imports = true
