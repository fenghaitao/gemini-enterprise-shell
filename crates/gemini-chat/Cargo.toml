[package]
name = "gemini-chat"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Client for the official Gemini Enterprise assistant API (Discovery Engine v1 streamAssist)"
keywords = ["gemini", "gemini-enterprise", "google-cloud", "assistant"]
categories = ["api-bindings"]

[lib]
doctest = false

[dependencies]
async-trait = "0.1.89"
# reqwest::retry::never() needs 0.12.23+.
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["process"] }
percent-encoding = "2.3"
url = "2.5.7"

[dev-dependencies]
tempfile = "3.12.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
