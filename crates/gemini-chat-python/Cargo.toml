[package]
name = "gemini-chat-python"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for gemini-chat (official Gemini Enterprise assistant API)"
keywords = ["gemini", "gemini-enterprise", "google-cloud", "python"]
categories = ["api-bindings"]
publish = false

[lib]
# Built by maturin as the `gemini_chat._native` extension module.
name = "_native"
crate-type = ["cdylib"]

[dependencies]
gemini-chat = { path = "../gemini-chat" }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py312"] }
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread"] }
