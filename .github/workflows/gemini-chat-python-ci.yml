name: gemini-chat Python CI

on:
  push:
    branches:
      - main
    paths:
      - "python/gemini-chat/**"
      - "crates/gemini-chat/**"
      - "crates/gemini-chat-python/**"
      - ".github/workflows/gemini-chat-python-ci.yml"
      - "Makefile.toml"
  pull_request:
    branches:
      - main
    paths:
      - "python/gemini-chat/**"
      - "crates/gemini-chat/**"
      - "crates/gemini-chat-python/**"
      - ".github/workflows/gemini-chat-python-ci.yml"
      - "Makefile.toml"

env:
  CARGO_TERM_COLOR: always

jobs:
  gemini-chat-python-checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "python/gemini-chat/uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: ${{ runner.os }}-gemini-chat-python-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gemini-chat-python-ci-

      - name: Install cargo-make
        uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          tool: cargo-make

      - name: Build, lint, type-check and test
        run: cargo make chat-py-ci
