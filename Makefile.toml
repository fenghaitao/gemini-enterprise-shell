[config]
skip_core_tasks = true
default_to_workspace = false

[env]
UV_RUN_ARGS = "run;--extra;dev;--directory;python"

[tasks.before-build]

# ------------------------- Pre-commit -------------------------
[tasks.install]
description = "Install prek and set up git hooks"
dependencies = ["install-prek", "setup-prek"]

[tasks.install-prek]
description = "Install prek using cargo install"
command = "cargo"
args = ["install", "--locked", "--git", "https://github.com/j178/prek"]

[tasks.setup-prek]
description = "Set up prek git hooks"
command = "prek"
args = ["install"]

[tasks.default]
description = "Default task"
dependencies = ["fmt", "lint", "check"]

[tasks.fmt]
description = "Apply rustfmt to all projects"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-ci]
description = "Verify formatting"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.lint]
description = "Verify zero clippy warnings"
command = "cargo"
args = [
    "clippy",
    "--workspace",
    "--exclude",
    "nblm-python",
    "--exclude",
    "gemini-chat-python",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]

[tasks.test]
description = "Run test suite"
command = "cargo"
args = ["test", "--workspace", "--exclude", "nblm-python", "--exclude", "gemini-chat-python"]

[tasks.check]
dependencies = ["before-build"]
command = "cargo"
args = ["check", "--workspace", "--exclude", "nblm-python", "--exclude", "gemini-chat-python"]

[tasks.build]
dependencies = ["before-build"]
command = "cargo"
args = ["build", "--workspace", "--exclude", "nblm-python", "--exclude", "gemini-chat-python", "${@}"]

[tasks.install-cli]
description = "Build and install/update the CLI from this checkout"
command = "cargo"
args = ["install", "--path", "crates/nblm-cli", "--force", "--locked"]

[tasks.install-chat]
description = "Build and install/update the gemini-chat CLI from this checkout"
command = "cargo"
args = ["install", "--path", "crates/gemini-chat-cli", "--force", "--locked"]

[tasks.run]
description = "Rebuild as needed and run the CLI from this checkout"
command = "cargo"
args = ["run", "--locked", "--package", "nblm-cli", "--", "${@}"]

[tasks.clean]
dependencies = ["before-build"]
command = "cargo"
args = ["clean"]

[tasks.fetch]
dependencies = ["before-build"]
command = "cargo"
args = ["fetch"]

[tasks.coverage]
description = "Generate coverage report using cargo-llvm-cov"
dependencies = ["before-build"]
command = "cargo"
args = [
    "llvm-cov",
    "--workspace",
    "--all-features",
    "--exclude",
    "nblm-python",
    "--exclude",
    "gemini-chat-python",
    "--open",
]

[tasks.all]
description = "Run fmt, lint, and test together"
dependencies = ["install","fmt", "lint", "test", "py-all"]

# ------------------------- CI -------------------------
[tasks.ci]
description = "Run CI checks (fmt, clippy, tests)"
dependencies = ["fmt-ci", "clippy-ci", "test-ci"]

[tasks.clippy-ci]
dependencies = ["before-build"]
command = "cargo"
args = [
    "clippy",
    "--locked",
    "--workspace",
    "--exclude",
    "nblm-python",
    "--exclude",
    "gemini-chat-python",
    "--all-targets",
    "--all-features",
    "--",
    "-D",
    "warnings",
]

[tasks.test-ci]
dependencies = ["before-build"]
command = "cargo"
args = [
    "test",
    "--locked",
    "--workspace",
    "--exclude",
    "nblm-python",
    "--exclude",
    "gemini-chat-python",
    "--all-targets",
]

# ------------------------- Version Management -------------------------
[tasks.bump]
description = "Bump version across all packages (Usage: ./scripts/bump-version.sh <version>)"
script_runner = "@shell"
script = '''
echo "To bump version, run:"
echo "  ./scripts/bump-version.sh <version>"
echo ""
echo "Example:"
echo "  ./scripts/bump-version.sh 0.1.1"
'''

# ------------------------- Python -------------------------
# Python: per-package tasks (nblm-py-*, chat-py-*) and aggregates (py-*) running both.

[tasks.nblm-py-fmt]
description = "Format Python code with ruff (nblm, python/)"
dependencies = ["py-setup"]
command = "uv"
args = ["@@split(UV_RUN_ARGS,;)", "ruff", "format", "src", "tests"]

[tasks.nblm-py-fmt-check]
description = "Check Python code formatting (nblm, python/)"
dependencies = ["py-setup"]
command = "uv"
args = ["@@split(UV_RUN_ARGS,;)", "ruff", "format", "--check", "src", "tests"]

[tasks.nblm-py-lint]
description = "Lint Python code with ruff (nblm, python/)"
dependencies = ["py-setup"]
command = "uv"
args = ["@@split(UV_RUN_ARGS,;)", "ruff", "check", "src", "tests"]

[tasks.nblm-py-lint-fix]
description = "Lint and fix Python code with ruff (nblm, python/)"
dependencies = ["py-setup"]
command = "uv"
args = ["@@split(UV_RUN_ARGS,;)", "ruff", "check", "--fix", "src", "tests"]

[tasks.nblm-py-type]
description = "Run mypy type checking (nblm, python/)"
dependencies = ["py-setup"]
command = "uv"
args = ["@@split(UV_RUN_ARGS,;)", "mypy", "src", "tests"]

[tasks.nblm-py-test]
description = "Run Python tests with pytest (nblm, python/)"
dependencies = ["py-setup"]
command = "uv"
args = ["@@split(UV_RUN_ARGS,;)", "pytest", "tests", "-v"]

[tasks.nblm-py-build]
description = "Build the editable Python package with maturin (nblm, python/)"
dependencies = ["py-setup"]
command = "uv"
args = ["@@split(UV_RUN_ARGS,;)", "maturin", "develop"]

[tasks.chat-py-setup]
private = true
cwd = "python/gemini-chat"
command = "uv"
args = ["sync", "--locked", "--extra", "dev"]

[tasks.chat-py-fmt]
description = "Format Python code with ruff (gemini_chat, python/gemini-chat)"
dependencies = ["chat-py-setup"]
cwd = "python/gemini-chat"
command = "uv"
args = ["run", "--locked", "--extra", "dev", "ruff", "format", "src", "tests"]

[tasks.chat-py-fmt-check]
description = "Check Python code formatting (gemini_chat, python/gemini-chat)"
dependencies = ["chat-py-setup"]
cwd = "python/gemini-chat"
command = "uv"
args = ["run", "--locked", "--extra", "dev", "ruff", "format", "--check", "src", "tests"]

[tasks.chat-py-lint]
description = "Lint Python code with ruff (gemini_chat, python/gemini-chat)"
dependencies = ["chat-py-setup"]
cwd = "python/gemini-chat"
command = "uv"
args = ["run", "--locked", "--extra", "dev", "ruff", "check", "src", "tests"]

[tasks.chat-py-lint-fix]
description = "Lint and fix Python code with ruff (gemini_chat, python/gemini-chat)"
dependencies = ["chat-py-setup"]
cwd = "python/gemini-chat"
command = "uv"
args = ["run", "--locked", "--extra", "dev", "ruff", "check", "--fix", "src", "tests"]

[tasks.chat-py-type]
description = "Run mypy type checking (gemini_chat, python/gemini-chat)"
dependencies = ["chat-py-setup"]
cwd = "python/gemini-chat"
command = "uv"
args = ["run", "--locked", "--extra", "dev", "mypy", "src", "tests"]

[tasks.chat-py-test]
description = "Run Python tests with pytest (gemini_chat, python/gemini-chat)"
dependencies = ["chat-py-setup"]
cwd = "python/gemini-chat"
command = "uv"
args = ["run", "--locked", "--extra", "dev", "pytest", "tests", "-v"]

[tasks.chat-py-build]
description = "Build the editable Python package with maturin (gemini_chat, python/gemini-chat)"
dependencies = ["chat-py-setup"]
cwd = "python/gemini-chat"
command = "uv"
args = ["run", "--locked", "--extra", "dev", "maturin", "develop"]

[tasks.py-fmt]
description = "Format Python code with ruff for both Python packages"
dependencies = ["nblm-py-fmt", "chat-py-fmt"]

[tasks.py-fmt-check]
description = "Check Python code formatting for both Python packages"
dependencies = ["nblm-py-fmt-check", "chat-py-fmt-check"]

[tasks.py-lint]
description = "Lint Python code with ruff for both Python packages"
dependencies = ["nblm-py-lint", "chat-py-lint"]

[tasks.py-lint-fix]
description = "Lint and fix Python code with ruff for both Python packages"
dependencies = ["nblm-py-lint-fix", "chat-py-lint-fix"]

[tasks.py-type]
description = "Run mypy type checking for both Python packages"
dependencies = ["nblm-py-type", "chat-py-type"]

[tasks.py-test]
description = "Run Python tests with pytest for both Python packages"
dependencies = ["nblm-py-test", "chat-py-test"]

[tasks.py-build]
description = "Build the editable Python package with maturin for both Python packages"
dependencies = ["nblm-py-build", "chat-py-build"]

[tasks.py-all]
description = "Run all Python checks (fmt, lint, type, build) for both packages"
dependencies = ["py-fmt", "py-lint-fix", "py-type", "py-build"]

[tasks.chat-py-ci]
description = "Build and check the gemini_chat Python package (python/gemini-chat)"
dependencies = [
    "chat-py-build",
    "chat-py-fmt-check",
    "chat-py-lint",
    "chat-py-type",
    "chat-py-test",
]

[tasks.gesh-ci]
description = "Check gesh (builds the nblm and gemini_chat Python SDKs)"
cwd = "gesh"
script = [
    "uv sync --locked",
    "uv run --locked ruff format --check src tests",
    "uv run --locked ruff check src tests",
    "uv run --locked mypy",
    "uv run --locked pytest -v",
]

[tasks.py-setup]
private = true
condition = { files_modified = { input = [
    "python/pyproject.toml",
    "python/uv.lock",
], output = [
    "python/.venv/timestamp.txt",
] } }
cwd = "python"
command = "bash"
args = [
    "-euo",
    "pipefail",
    "-c",
    "uv venv --clear && uv sync --frozen && touch .venv/timestamp.txt",
]

# ------------------------- Docs -------------------------
[tasks.docs-serve]
description = "Serve documentation locally"
command = "uv"
args = [
    "run",
    "--project",
    "docs",
    "mkdocs",
    "serve",
]

[tasks.docs-deploy]
description = "Deploy documentation to GitHub Pages (manual emergency deployment)"
command = "uv"
args = [
    "run",
    "--project",
    "docs",
    "mkdocs",
    "gh-deploy",
    "--config-file",
    "mkdocs.yml",
    "--remote-name",
    "origin",
    "--remote-branch",
    "gh-pages",
    "--force",
]
